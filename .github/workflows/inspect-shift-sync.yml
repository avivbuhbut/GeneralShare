name: Inspect Shift Sync OCR

on:
  push:
    branches:
      - aviv-shift-sync-download

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and print OCR source
        shell: bash
        run: |
          set -euo pipefail
          cat aviv-shift-sync-source/chunk_* > /tmp/app.b64
          base64 -d /tmp/app.b64 > /tmp/app.tar.gz
          mkdir appsrc
          tar -xzf /tmp/app.tar.gz -C appsrc
          echo '=== OcrEngine.java ==='
          cat appsrc/app/src/main/java/il/co/aviv/shiftsync/OcrEngine.java
          echo '=== MainActivity relevant ==='
          grep -n -B 8 -A 24 -E 'OcrEngine|recogn|detect|crop|Bitmap' appsrc/app/src/main/java/il/co/aviv/shiftsync/MainActivity.java || true
