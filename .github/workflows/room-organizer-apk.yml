name: Build Room Organizer APK

on:
  push:
    branches:
      - room-organizer-ai-build
    paths:
      - "room-organizer-ai/**"
      - ".github/workflows/room-organizer-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: room-organizer-ai
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare artifact
        run: |
          cp room-organizer-ai/app/build/outputs/apk/debug/app-debug.apk RoomOrganizerAI.apk
          sha256sum RoomOrganizerAI.apk > RoomOrganizerAI.apk.sha256
          unzip -t RoomOrganizerAI.apk
          test -s RoomOrganizerAI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomOrganizerAI-APK
          path: |
            RoomOrganizerAI.apk
            RoomOrganizerAI.apk.sha256
          if-no-files-found: error
          retention-days: 7
