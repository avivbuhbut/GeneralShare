name: Build Aviv Shift Sync APK

on:
  push:
    branches:
      - aviv-shift-sync-download
    paths-ignore:
      - 'downloads/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct app and apply row-detection fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf shift-sync-phone
          cat aviv-shift-sync-source/chunk_* > /tmp/app.b64
          base64 -d /tmp/app.b64 > /tmp/app.tar.gz
          mkdir shift-sync-phone
          tar -xzf /tmp/app.tar.gz -C shift-sync-phone

          mkdir -p shift-sync-phone/app/src/main/assets/tessdata
          curl -L --fail --retry 3 \
            -o shift-sync-phone/app/src/main/assets/tessdata/heb.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata/3.04.00/heb.traineddata
          test -s shift-sync-phone/app/src/main/assets/tessdata/heb.traineddata
          sha256sum shift-sync-phone/app/src/main/assets/tessdata/heb.traineddata | cut -d' ' -f1 > /tmp/model.sha

          OCR=shift-sync-phone/app/src/main/java/il/co/aviv/shiftsync/OcrEngine.java
          sed -i 's/if (!heb.exists() || heb.length() < 100_000) {/if (true) {/' "$OCR"
          grep -q 'if (true)' "$OCR"

          PARSER=shift-sync-phone/app/src/main/java/il/co/aviv/shiftsync/ImageParser.java
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('shift-sync-phone/app/src/main/java/il/co/aviv/shiftsync/ImageParser.java')
          s = p.read_text()

          detect = r'''    private static int[] detectTwoRows(Mat gray) {
              List<Integer> lines = findHorizontalLines(gray);
              Collections.sort(lines);
              int h = gray.rows();

              // The schedule rule is explicit: always use the LAST two grid rows.
              // Prefer the bottom-most plausible triplet instead of the largest/balanced rows.
              if (lines.size() >= 3) {
                  for (int i = lines.size() - 3; i >= 0; i--) {
                      int y0 = lines.get(i), y1 = lines.get(i + 1), y2 = lines.get(i + 2);
                      int topHeight = y1 - y0;
                      int bottomHeight = y2 - y1;
                      if (Math.min(topHeight, bottomHeight) < 8) continue;
                      double ratio = Math.max(topHeight, bottomHeight) /
                              (double)Math.max(1, Math.min(topHeight, bottomHeight));
                      if (ratio <= 2.35) return new int[]{y0, y1, y2};
                  }
              }

              // If the bottom border is clipped, treat the image edge as the final border.
              if (lines.size() >= 2) {
                  int y0 = lines.get(lines.size() - 2);
                  int y1 = lines.get(lines.size() - 1);
                  int firstHeight = y1 - y0;
                  int edgeHeight = (h - 1) - y1;
                  if (firstHeight >= 8 && edgeHeight >= 8) {
                      double ratio = Math.max(firstHeight, edgeHeight) /
                              (double)Math.max(1, Math.min(firstHeight, edgeHeight));
                      if (ratio <= 2.35) return new int[]{y0, y1, h - 1};
                  }
              }

              // Tight two-row crop with only the center/bottom border detected.
              if (lines.size() >= 2) {
                  int y1 = lines.get(lines.size() - 2);
                  int y2 = lines.get(lines.size() - 1);
                  int row = y2 - y1;
                  if (row >= 8 && y2 >= h * 0.72) {
                      int y0 = Math.max(0, y1 - row);
                      if (y1 - y0 >= 8) return new int[]{y0, y1, y2};
                  }
              }

              // Last-resort split only for an already very tight, wide two-row strip.
              if (h >= 24 && gray.cols() / (double)Math.max(1, h) >= 4.0) {
                  int mid = h / 2;
                  return new int[]{0, mid, h - 1};
              }
              throw new IllegalStateException("קווי שתי השורות האחרונות לא זוהו בבטחה. השאר את כל רוחב הטבלה בתמונה.");
          }
'''

          horizontal = r'''    private static List<Integer> findHorizontalLines(Mat gray) {
              int h = gray.rows(), w = gray.cols();
              Mat inv = new Mat();
              int block = safeBlock(gray, 31);
              Imgproc.adaptiveThreshold(gray, inv, 255, Imgproc.ADAPTIVE_THRESH_MEAN_C,
                      Imgproc.THRESH_BINARY_INV, block, 12);

              // Row projection is more reliable than contour height here: Excel grid lines can
              // become connected to vertical borders/text and look like a tall contour.
              List<Integer> ys = new ArrayList<>();
              int minRun = Math.max(18, (int)(w * 0.22));
              for (int y = 0; y < h; y++) {
                  int run = 0, longest = 0;
                  for (int x = 0; x < w; x++) {
                      if (inv.get(y, x)[0] > 0) {
                          run++;
                          if (run > longest) longest = run;
                      } else {
                          run = 0;
                      }
                  }
                  if (longest >= minRun) ys.add(y);
              }
              inv.release();
              return clusterPositions(ys, Math.max(2, h / 100));
          }
'''

          s2, n1 = re.subn(
              r'    private static int\[] detectTwoRows\(Mat gray\) \{.*?\n    \}\n\n(?=    private static List<Integer> findHorizontalLines)',
              detect + '\n', s, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit(f'detectTwoRows replacement failed: {n1}')

          s3, n2 = re.subn(
              r'    private static List<Integer> findHorizontalLines\(Mat gray\) \{.*?\n    \}\n\n(?=    private static List<Integer> findVerticalLines)',
              horizontal + '\n', s2, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit(f'findHorizontalLines replacement failed: {n2}')

          p.write_text(s3)
          PY
          grep -q 'always use the LAST two grid rows' "$PARSER"
          grep -q 'int minRun = Math.max(18' "$PARSER"

          GRADLE=shift-sync-phone/app/build.gradle.kts
          sed -i 's/versionCode = 1/versionCode = 3/' "$GRADLE"
          sed -i 's/versionName = "1.0.0"/versionName = "1.0.2"/' "$GRADLE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('shift-sync-phone/app/build.gradle.kts')
          s = p.read_text()
          if 'abiFilters += listOf("arm64-v8a")' not in s:
              marker = '        versionName = "1.0.2"\n'
              if marker not in s:
                  raise SystemExit('version marker not found')
              s = s.replace(marker, marker + '        ndk {\n            abiFilters += listOf("arm64-v8a")\n        }\n', 1)
          p.write_text(s)
          PY
          grep -q 'versionCode = 3' "$GRADLE"
          grep -q 'versionName = "1.0.2"' "$GRADLE"
          grep -q 'arm64-v8a' "$GRADLE"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p shift-sync-phone :app:assembleDebug --stacktrace
          cp shift-sync-phone/app/build/outputs/apk/debug/app-debug.apk Aviv_Shift_Sync_Android_v1.0.2.apk
          test -s Aviv_Shift_Sync_Android_v1.0.2.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(cat /tmp/model.sha)
          ACTUAL=$(unzip -p Aviv_Shift_Sync_Android_v1.0.2.apk assets/tessdata/heb.traineddata | sha256sum | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          ABIS=$(unzip -Z1 Aviv_Shift_Sync_Android_v1.0.2.apk | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u | tr '\n' ' ')
          echo "ABIS=$ABIS"
          test "$ABIS" = 'arm64-v8a '
          unzip -t Aviv_Shift_Sync_Android_v1.0.2.apk >/dev/null
          sha256sum Aviv_Shift_Sync_Android_v1.0.2.apk > Aviv_Shift_Sync_Android_v1.0.2.sha256
          echo "APK_BYTES=$(wc -c < Aviv_Shift_Sync_Android_v1.0.2.apk)"
          echo "OCR_SHA256=$ACTUAL"

      - name: Publish direct-download APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp Aviv_Shift_Sync_Android_v1.0.2.apk downloads/
          cp Aviv_Shift_Sync_Android_v1.0.2.sha256 downloads/
          printf 'Aviv Shift Sync Android v1.0.2\nFix: deterministic bottom-two-row detection\nHebrew OCR: Tesseract 3.04\nABI: arm64-v8a\n' > downloads/BUILD_INFO.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f downloads
          git commit -m 'Publish Aviv Shift Sync Android v1.0.2' || true
          git push origin HEAD:aviv-shift-sync-download

      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='aviv-shift-sync-v1.0.2'
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            Aviv_Shift_Sync_Android_v1.0.2.apk \
            Aviv_Shift_Sync_Android_v1.0.2.sha256 \
            --title 'Aviv Shift Sync Android v1.0.2' \
            --notes 'Fixes recognition of the actual last two Excel rows, including the exact wide crop case Aviv supplied. Hebrew OCR included. ARM64 Android APK.'
