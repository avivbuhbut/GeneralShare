name: Build Aviv Shift Sync APK

on:
  push:
    branches:
      - aviv-shift-sync-download
    paths-ignore:
      - 'downloads/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf shift-sync-phone
          cat aviv-shift-sync-source/chunk_* > /tmp/app.b64
          base64 -d /tmp/app.b64 > /tmp/app.tar.gz
          mkdir shift-sync-phone
          tar -xzf /tmp/app.tar.gz -C shift-sync-phone

      - name: Install high-accuracy Hebrew OCR model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shift-sync-phone/app/src/main/assets/tessdata
          curl -L --fail --retry 3 -o shift-sync-phone/app/src/main/assets/tessdata/heb.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/heb.traineddata
          test -s shift-sync-phone/app/src/main/assets/tessdata/heb.traineddata
          sha256sum shift-sync-phone/app/src/main/assets/tessdata/heb.traineddata | cut -d' ' -f1 > /tmp/model.sha

      - name: Apply v1.0.4 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 shift-sync-fix/patch_v104.py
          python3 shift-sync-fix/patch_v104_repos.py
          grep -q 'OEM_LSTM_ONLY' shift-sync-phone/app/src/main/java/il/co/aviv/shiftsync/OcrEngine.java
          grep -q 'findVerticalLinesColor' shift-sync-phone/app/src/main/java/il/co/aviv/shiftsync/ImageParser.java
          grep -q 'Each file is independent' shift-sync-phone/app/src/main/java/il/co/aviv/shiftsync/MainActivity.java
          grep -q 'נמצאו ונשמרו' shift-sync-phone/app/src/main/java/il/co/aviv/shiftsync/MainActivity.java
          grep -q 'tesseract4android-openmp:4.9.0' shift-sync-phone/app/build.gradle.kts
          grep -q 'jitpack.io' shift-sync-phone/settings.gradle.kts
          grep -q 'versionName = "1.0.4"' shift-sync-phone/app/build.gradle.kts

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p shift-sync-phone :app:assembleDebug --stacktrace
          cp shift-sync-phone/app/build/outputs/apk/debug/app-debug.apk Aviv_Shift_Sync_Android_v1.0.4.apk
          test -s Aviv_Shift_Sync_Android_v1.0.4.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(cat /tmp/model.sha)
          ACTUAL=$(unzip -p Aviv_Shift_Sync_Android_v1.0.4.apk assets/tessdata/heb.traineddata | sha256sum | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          ABIS=$(unzip -Z1 Aviv_Shift_Sync_Android_v1.0.4.apk | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u | tr '\n' ' ')
          echo "ABIS=$ABIS"
          test "$ABIS" = 'arm64-v8a '
          unzip -t Aviv_Shift_Sync_Android_v1.0.4.apk >/dev/null
          sha256sum Aviv_Shift_Sync_Android_v1.0.4.apk > Aviv_Shift_Sync_Android_v1.0.4.sha256
          echo "APK_BYTES=$(wc -c < Aviv_Shift_Sync_Android_v1.0.4.apk)"

      - name: Publish direct download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp Aviv_Shift_Sync_Android_v1.0.4.apk downloads/
          cp Aviv_Shift_Sync_Android_v1.0.4.sha256 downloads/
          printf 'Aviv Shift Sync Android v1.0.4\nOCR: Tesseract 5.5.1 LSTM + tessdata_best Hebrew\nFix: colored/red empty cells no longer break day columns\nFix: bottom two Excel rows\nFix: continue when Aviv is absent from one shift image\nUI: clean chronological summary\nABI: arm64-v8a\n' > downloads/BUILD_INFO.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f downloads
          git commit -m 'Publish Aviv Shift Sync Android v1.0.4' || true
          git push origin HEAD:aviv-shift-sync-download

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=aviv-shift-sync-v1.0.4
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Aviv_Shift_Sync_Android_v1.0.4.apk Aviv_Shift_Sync_Android_v1.0.4.sha256 --title 'Aviv Shift Sync Android v1.0.4' --notes 'Major recognition fix: modern Tesseract 5.5.1 LSTM with high-accuracy Hebrew model, robust colored-cell column detection, and a clean chronological summary. Keeps bottom-two-row and per-file resilience fixes.'
