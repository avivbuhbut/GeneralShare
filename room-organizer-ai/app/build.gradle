plugins {
    id "com.android.application"
}

android {
    namespace "com.aviv.roomsort"
    compileSdk 35

    defaultConfig {
        applicationId "com.aviv.roomsort"
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName "1.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
